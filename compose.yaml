services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* harus di-inline saat build (lihat Dockerfile).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3006}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    # Secret (POSTGRES_URL, GROQ_API_KEY, ADMIN_*) masuk saat RUNTIME,
    # tidak pernah ter-bake ke dalam image.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3006
      HOSTNAME: 0.0.0.0
    ports:
      - "3006:3006"
    restart: unless-stopped
